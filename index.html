<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b4531a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="わんヘルス">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>わんヘルス - 犬の健康管理</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1><span aria-hidden="true">🐾</span> わんヘルス</h1>
    <select id="dogSwitcher" aria-label="表示する犬を切り替え" hidden></select>
  </header>

  <main id="view"></main>

  <nav class="tabbar" aria-label="メインメニュー">
    <button type="button" data-tab="home"><span aria-hidden="true">🏠</span>ホーム</button>
    <button type="button" data-tab="logs"><span aria-hidden="true">📒</span>記録</button>
    <button type="button" data-tab="weight"><span aria-hidden="true">⚖️</span>体重</button>
    <button type="button" data-tab="care"><span aria-hidden="true">💉</span>予防・通院</button>
    <button type="button" data-tab="settings"><span aria-hidden="true">⚙️</span>設定</button>
  </nav>

  <dialog id="formDialog"></dialog>
  <dialog id="photoDialog" aria-label="写真">
    <img alt="拡大した写真">
    <button type="button" class="btn">閉じる</button>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script src="app.js"></script>
</body>
</html>
